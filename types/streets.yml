# One persisted anchor and eleven virtual decorations — the realm-uk-streets
# posture: the set of places is small, hand-curated and the user's own, so it
# belongs in the graph; everything around each place is live external data,
# fetched per query and gone at rollback. GeoMet-backed types carry the
# source's own French fields beside the English ones — official wording in
# both languages, never a re-translation.

# A place in Canada the user is watching. Geography is resolved ONCE when the
# place is added — via `gateway.represent.representPostcode` for a postal
# code, or `gateway.nrcanGeolocator.nrcanGeolocate` + the Represent point
# lookups for a bare place name — and every stored field is a JOIN KEY into a
# different national dataset.
- name: CaPlace
  description: "A Canadian place the user is watching, with geography already resolved from its postal code (or its name, via NRCan geolocation) so representation, census, air, river and weather lookups need no further geocoding."
  properties:
    name:
      type: string
      description: "How the user refers to the place, e.g. 'The Annex' or 'Grandma's street'. Shown as the headline."
    postalCode:
      type: string
      description: "The postal code it was resolved from, UPPERCASE with no space, e.g. K1A0A9 — the key the all-representatives join uses. Null for a place added by NAME; that join stays empty then, which is correct."
    latitude:
      type: number
      description: "Latitude in decimal degrees."
    longitude:
      type: number
      description: "Longitude in decimal degrees."
    city:
      type: string
      description: "Municipality name, e.g. 'TORONTO'."
    province:
      type: string
      description: "Two-letter province/territory code, e.g. ON, QC, BC."
    riding:
      type: string
      description: "The CURRENT federal electoral district name, from the House of Commons record (the MP's district_name — the boundary list carries several vintages; the MP's is the authoritative current one)."
    csd:
      type: string
      description: "Census subdivision (municipality) code, e.g. 3520005 for Toronto."
    dguid:
      type: string
      description: "The census DGUID: '2021A0005' + csd — the key ALL census joins use. Absent when no census subdivision was resolved; census joins stay empty then, which is correct."
    latlon:
      type: string
      description: "The pair as one string, 'lat,lon' — the key the MP join uses."
    bbox:
      type: string
      description: "A ~±0.2° box around the place as 'lonMin,latMin,lonMax,latMax' — the key the river, alert and city-weather joins use (roughly 20 km each way)."
    bboxWide:
      type: string
      description: "A ~±0.7° box, same format — the key the AQHI join uses (stations exist near cities only, so the air join casts wider)."
    lfsVector:
      type: string
      description: "StatCan WDS vector id (bare digits) for the place's CURRENT unemployment rate — the CMA's series from table 14-10-0459, or the province's as fallback. The key the HAS_UNEMPLOYMENT_NOW join uses."
    lfsCma:
      type: string
      description: "The LFS geography the vector describes, e.g. 'Toronto, Ontario' or just 'Ontario' when no CMA covers the place — always show it beside the rate."
    notes:
      type: string
      description: "Why the user watches this place — free text, optional."

# ── The riding axis ──────────────────────────────────────────────────────────
- name: CaSeat
  description: "The federal seat covering a watched place: the CURRENT sitting MP, party and riding, from the House of Commons via Represent. Reached via HAS_SEAT."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_SEAT
      keyField: latlon
      recordKeyField: key
      producer: mpForPoint
      maxAnchors: 15
      description: "The place's MP and party — the political half of every by-party view."
  properties:
    url:
      description: "The member's ourcommons.ca page. Identity — two places in one riding share the node."
      metadata:
        identity: "true"
    key: "The 'lat,lon' pair searched — the join link."
    mp: "The sitting MP's name."
    party: "The MP's party, e.g. Liberal, Conservative, NDP, Bloc Québécois."
    riding: "The federal electoral district name."
    email: "The MP's parliamentary email."
    photo: "URL of the official MP photo on ourcommons.ca."
    gender: "M/F as the source records it."

# EVERY level of government at the postal code — MP, MPP/MLA, mayor,
# councillor(s) — one row each. The join no official source serves: the
# House of Commons, the provincial legislature and city hall never publish
# a combined 'who represents this address' record.
- name: ElectedRep
  description: "One elected representative — federal MP, provincial MPP/MLA, mayor or councillor — for a watched place's postal code, from Represent. Reached via HAS_REP; typically 3-6 rows per place. Municipal coverage varies by city; a missing councillor is a coverage fact, not a vacancy. A place added by NAME has no postal code and no rows here."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_REP
      keyField: postalCode
      recordKeyField: key
      producer: repsForPostcode
      maxAnchors: 15
      description: "The full slate of elected representatives at the postal code, all levels of government at once."
  properties:
    key: "The postal code searched — the join link."
    office: "The office held: MP, MPP, MLA, Mayor, Councillor…"
    name: "The representative's name."
    party: "Party name — often empty at municipal level, where politics is non-partisan."
    district: "The district the office covers (riding, provincial district, ward, city)."
    body: "The body they sit in, e.g. 'House of Commons', 'Legislative Assembly of Ontario', 'Toronto City Council'."
    email: "Public contact email, when published."
    photo: "Official photo URL, when published."

# ── The coordinate axis ──────────────────────────────────────────────────────
- name: AirQualityObs
  description: "The LATEST Air Quality Health Index observation at each monitoring station near a watched place (±0.7°), from Environment Canada. Reached via HAS_AIR. AQHI scale: 1-3 low risk, 4-6 moderate, 7-10 high, 10+ very high. Stations exist near cities and larger towns only, and the federal network does NOT include Québec (own IQA network) — an empty result is a COVERAGE fact, not clean air."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_AIR
      keyField: bboxWide
      recordKeyField: key
      producer: aqhiNear
      maxAnchors: 15
      description: "Latest AQHI per station near the place — average or take the max when one number is wanted."
  properties:
    id:
      description: "The observation id (station + timestamp). Identity."
      metadata:
        identity: "true"
    key: "The bbox searched — the join link."
    station: "The monitoring station's name in English, e.g. 'Toronto Downtown'."
    stationFr: "The station's name in French, from the source, e.g. 'Toronto centre-ville'."
    aqhi:
      type: number
      description: "The Air Quality Health Index value — 1 is clean, 10+ is very high risk."
    observedAt: "Observation time, ISO 8601 UTC."

- name: RiverReading
  description: "A real-time water-level reading from a hydrometric gauge near a watched place (±0.2°), from the Water Survey of Canada via GeoMet. Reached via HAS_RIVER — up to 30 recent 5-minute readings across nearby stations; de-duplicate by stationNumber for the latest per river. LEVEL is metres on the station's own datum: compare a station against ITSELF over time, never one river's level against another's."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_RIVER
      keyField: bbox
      recordKeyField: key
      producer: riverReadings
      maxAnchors: 15
      description: "Recent gauge readings near the place, newest first — group by station and take the newest for 'how are the rivers right now'."
  properties:
    id:
      description: "Station number + timestamp. Identity."
      metadata:
        identity: "true"
    key: "The bbox searched — the join link."
    station: "The gauge's official name, e.g. 'RIDEAU RIVER AT OTTAWA' (recorded in one language by the Water Survey)."
    stationNumber: "Water Survey of Canada station number, e.g. 02LA004 — the de-duplication key."
    level:
      type: number
      description: "Water level in metres, on the station's own datum."
    discharge:
      type: number
      description: "Flow in m³/s — often null; a null is unmeasured, not zero flow."
    at: "Reading time, ISO 8601 UTC."
    province: "Province/territory of the station."

- name: CaWeatherAlert
  description: "An ACTIVE Environment Canada weather alert whose polygon touches a watched place's ~20 km box. Reached via HAS_ALERT; empty is the normal, good answer. alertType ranks: warning > watch > advisory > statement. Bilingual: alertName/text are the official English wording, alertNameFr/textFr the official French."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_ALERT
      keyField: bbox
      recordKeyField: key
      producer: alertsNear
      maxAnchors: 15
      description: "Live official alerts at the place — join to HAS_SEAT for 'which MP's constituents are under an alert right now'."
  properties:
    key: "The bbox searched — the join link."
    alertType: "warning, watch, advisory or statement — warning is most severe."
    alertName: "The alert's official English name, e.g. 'snowfall warning'."
    alertNameFr: "The alert's official French name, e.g. 'avertissement de neige'."
    text: "The alert's full official English text."
    textFr: "The alert's full official French text."
    published: "When it was published, ISO 8601 UTC."
    expires: "When the bulletin expires, ISO 8601 UTC."

- name: LocalWeather
  description: "Current conditions at the weather.gc.ca city page(s) nearest a watched place. Reached via HAS_WEATHER. Overnight some sites report no conditions — nulls are normal, not an outage. Bilingual: site/condition carry the official English wording, siteFr/conditionFr the official French."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_WEATHER
      keyField: bbox
      recordKeyField: key
      producer: cityWeatherNear
      maxAnchors: 15
      description: "Temperature and conditions right now near the place."
  properties:
    id:
      description: "The city page identifier, e.g. on-128. Identity."
      metadata:
        identity: "true"
    key: "The bbox searched — the join link."
    site: "The city page's English name, e.g. 'Toronto Island'."
    siteFr: "The city page's French name."
    temperature:
      type: number
      description: "Current temperature, °C."
    condition: "Current condition, official English wording, e.g. 'Light Rain'."
    conditionFr: "Current condition, official French wording, e.g. 'Pluie faible'."
    humidity:
      type: number
      description: "Relative humidity, %."
    updated: "When the page was last updated, ISO 8601 UTC."

# ── The census (municipality) axis ───────────────────────────────────────────
# Five one-figure types, each its own producer call, all keyed on the place's
# DGUID. CSD level means the WHOLE municipality: Toronto's figure describes
# 2.8M people, not the block — say so when presenting.
- name: CaPopulation
  description: "Census 2021 population of a watched place's municipality (census subdivision). Reached via HAS_POPULATION — one row per place. Describes the whole municipality, not the street."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_POPULATION
      keyField: dguid
      recordKeyField: key
      producer: censusPopulation
      maxAnchors: 15
      description: "The municipality's 2021 census population."
  properties:
    key:
      description: "The DGUID — the join link, and the identity: one figure per municipality."
      metadata:
        identity: "true"
    value:
      type: number
      description: "Population, 2021 Census."
    area: "The municipality's official census name."

- name: CaMedianAge
  description: "Median age of the population, Census 2021, for a watched place's municipality. Reached via HAS_MEDIAN_AGE — one row per place."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_MEDIAN_AGE
      keyField: dguid
      recordKeyField: key
      producer: censusMedianAge
      maxAnchors: 15
      description: "The municipality's median age."
  properties:
    key:
      description: "The DGUID — join link and identity."
      metadata:
        identity: "true"
    value:
      type: number
      description: "Median age in years, 2021 Census."
    area: "The municipality's official census name."

- name: CaHouseholdIncome
  description: "Median total household income in 2020 ($), Census 2021, for a watched place's municipality. Reached via HAS_HOUSEHOLD_INCOME — one row per place. The income year is 2020 (the census asks about the prior year)."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_HOUSEHOLD_INCOME
      keyField: dguid
      recordKeyField: key
      producer: censusHouseholdIncome
      maxAnchors: 15
      description: "The municipality's median household income — the income half of every affluence view."
  properties:
    key:
      description: "The DGUID — join link and identity."
      metadata:
        identity: "true"
    value:
      type: number
      description: "Median total household income, 2020, CAD."
    area: "The municipality's official census name."

- name: CaDwellingValue
  description: "Median value of dwellings ($), Census 2021, owner-estimated, for a watched place's municipality. Reached via HAS_DWELLING_VALUE — one row per place. Owner-stated value, not sale prices — Canada publishes no national price-paid register."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_DWELLING_VALUE
      keyField: dguid
      recordKeyField: key
      producer: censusDwellingValue
      maxAnchors: 15
      description: "The municipality's median dwelling value — the housing half of the affordability views."
  properties:
    key:
      description: "The DGUID — join link and identity."
      metadata:
        identity: "true"
    value:
      type: number
      description: "Median dwelling value, CAD, owner-estimated, 2021 Census."
    area: "The municipality's official census name."

- name: CaUnemploymentNow
  description: "CURRENT unemployment rate for the watched place's census metropolitan area (or its province, where no CMA covers it) — StatCan Labour Force Survey, table 14-10-0459, three-month moving average, seasonally adjusted, monthly. Reached via HAS_UNEMPLOYMENT_NOW; one row per month since 2025, so take the LATEST month (ORDER BY month DESC). Replaces the 2021 census unemployment figure, whose reference week was May 2021 — mid-pandemic and not comparable to today."
  virtualJoins:
    - anchorLabel: CaPlace
      relationship: HAS_UNEMPLOYMENT_NOW
      keyField: lfsVector
      recordKeyField: key
      producer: lfsMonthly
      maxAnchors: 15
      description: "Monthly unemployment rates for the place's CMA/province — always take the latest month; the series exists for trend questions."
  properties:
    key: "The WDS vector id — the join link."
    month: "The reference month, YYYY-MM-DD (first of month)."
    rate:
      type: number
      description: "Unemployment rate, %, three-month moving average, seasonally adjusted."
