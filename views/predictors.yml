               WHEN '53079822' THEN 'Peterborough, Ontario'
               WHEN '53079468' THEN 'Québec, Quebec'
               WHEN '1593151896' THEN 'Red Deer, Alberta'
               WHEN '53079678' THEN 'Regina, Saskatchewan'
               WHEN '53079459' THEN 'Saguenay, Quebec'
               WHEN '53079900' THEN 'Saint John, New Brunswick'
               WHEN '53079687' THEN 'Saskatoon, Saskatchewan'
               WHEN '53079477' THEN 'Sherbrooke, Quebec'
               WHEN '53079573' THEN 'St. Catharines-Niagara, Ontario'
               WHEN '53079657' THEN 'St. John\'s, Newfoundland and Labrador'
               WHEN '53079618' THEN 'Thunder Bay, Ontario'
               WHEN '53079543' THEN 'Toronto, Ontario'
               WHEN '53079486' THEN 'Trois-Rivières, Quebec'
               WHEN '53079738' THEN 'Vancouver, British Columbia'
               WHEN '53079747' THEN 'Victoria, British Columbia'
               WHEN '53079600' THEN 'Windsor, Ontario'
               WHEN '53079648' THEN 'Winnipeg, Manitoba'
               ELSE ct.vector END AS clearCma
    WHERE clearCma = cma
    WITH cma, c21,
         (c21 / c18 - 1) * 100 AS dCsiEarly,
         (c25 / c21 - 1) * 100 AS dCsiLate,
         (toFloat(cm.value) - toFloat(ct.value)) AS dClrEarly,
         (toFloat(cn.value) - toFloat(cm.value)) AS dClrLate
    WHERE dClrEarly IS NOT NULL AND dClrLate IS NOT NULL
    RETURN correlate(dClrEarly, dCsiLate) AS clearanceLeadsCrime,
           correlate(dCsiEarly, dClrLate) AS crimeLeadsClearance,
           correlate(dClrLate, dCsiLate) AS sameWindow,
           regress([dClrEarly, c21], dCsiLate, cma) AS leadModel,
           count(*) AS cmas

# ── The lagged model: yesterday's structure against today's crime ──────────
# The contemporaneous battery cannot rule out today's crime driving today's
# clearance. This one can, for its own coefficients: every predictor is a
# 2018-2021 vintage, measured before the 2025 outcome existed.
- name: WhatForetoldCanadianCrime
  description: "The ALTERNATIVE crime model, fitted entirely on the PREVIOUS period: 2025 crime severity regressed on predictors measured four to seven years EARLIER — median family income 2018, the pre-pandemic June-2019 unemployment rate, the 20-24 share in 2021, early population growth 2018-2021, the 2021 weighted clearance rate, and the 2021 population — with each predictor's lagged correlation beside the fit. Every predictor PRECEDES the outcome, so the crude reverse story (2025 crime swamping 2025 clearance) cannot produce a coefficient here. Read beside WhatBestPredictsCanadianCrime: a predictor that holds its strength under the lag has temporal precedence; one that collapses was riding the same-year loop. Precedence is still not causation — these series are sticky, so a common cause moving both slowly survives the test, and ClearanceLeadsOrLags is the sharper instrument for direction. The 2021 vintages are the pandemic year, the only midpoint published; income is 2018 and unemployment June 2019 precisely to stay clear of it. Same ~39-CMA sample discipline, StatCan 35-10-0026 / 11-10-0009 / 14-10-0459 / 17-10-0148."
