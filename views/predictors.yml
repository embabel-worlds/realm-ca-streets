               WHEN '53079657' THEN 'St. John\'s, Newfoundland and Labrador'
               WHEN '53079618' THEN 'Thunder Bay, Ontario'
               WHEN '53079543' THEN 'Toronto, Ontario'
               WHEN '53079486' THEN 'Trois-Rivières, Quebec'
               WHEN '53079738' THEN 'Vancouver, British Columbia'
               WHEN '53079747' THEN 'Victoria, British Columbia'
               WHEN '53079600' THEN 'Windsor, Ontario'
               WHEN '53079648' THEN 'Winnipeg, Manitoba'
               ELSE cm.vector END AS clearCma
    WHERE clearCma = cma
    WITH cma, csi, income2018, unemployment2019, youngAdults2021, earlyGrowth, population2021, toFloat(cm.value) AS clearance2021
    WHERE income2018 IS NOT NULL AND unemployment2019 IS NOT NULL AND youngAdults2021 IS NOT NULL
      AND earlyGrowth IS NOT NULL AND clearance2021 IS NOT NULL AND population2021 IS NOT NULL
    RETURN correlate(income2018, csi) AS laggedIncomeVsCrime,
           correlate(unemployment2019, csi) AS laggedUnemploymentVsCrime,
           correlate(youngAdults2021, csi) AS laggedYoungAdultsVsCrime,
           correlate(earlyGrowth, csi) AS laggedGrowthVsCrime,
           correlate(clearance2021, csi) AS laggedClearanceVsCrime,
           correlate(population2021, csi) AS laggedPopulationVsCrime,
           regress([income2018, unemployment2019, youngAdults2021, earlyGrowth, clearance2021, population2021], csi, cma) AS model,
           count(*) AS cmas
