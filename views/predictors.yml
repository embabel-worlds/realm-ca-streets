               WHEN '1593151874' THEN 'Drummondville, Quebec'
               WHEN '44312665' THEN 'Edmonton, Alberta'
               WHEN '1593151856' THEN 'Fredericton, New Brunswick'
               WHEN '44312605' THEN 'Greater Sudbury, Ontario'
               WHEN '52117764' THEN 'Guelph, Ontario'
