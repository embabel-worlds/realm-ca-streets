# The model the crime-predictors app drives: WHICH predictors are in the fit
# is the caller's choice, so a person can add one and watch what it does to
# the others. Every predictor is required non-null whether or not it is
# enabled — the pipeline's standing gate — so the CMA set never moves with the
# toggles and a beta that changed changed because the MODEL did.
- name: CaCrimeModelWithPredictors
  description: "A least-squares fit of CMA crime severity on WHICHEVER of the six predictors the caller enables — median family income, unemployment rate, the 20-24 share, population growth 2021-2025, the weighted clearance rate and population — with standardized betas, R², and the CMAs furthest above and below prediction. Enabling exactly one gives that predictor's association measured ALONE (a solo standardized beta is its correlation), so the same view answers 'what does this variable claim by itself' and 'what survives beside the others'. The CMA set is IDENTICAL for every combination (~39, every predictor required non-null whether enabled or not), so a beta that moves moved because the model changed, not the sample. Predictors are returned as x1..xn in this fixed order: income, unemployment, youngAdults, growth, clearance, population. Association across areas, never causation, and never a statement about any person; clearance is simultaneity on its face and reads as the impunity association, not an effect."
  params:
    income: { type: boolean, default: true, description: "Include T1FF median family income (2023)." }
    unemployment: { type: boolean, default: true, description: "Include the LFS unemployment rate (3-month average, seasonally adjusted, mid-2026)." }
    youngAdults: { type: boolean, default: true, description: "Include the share of residents aged 20-24 (2025 estimates)." }
    growth: { type: boolean, default: true, description: "Include population growth 2021-2025." }
    clearance: { type: boolean, default: true, description: "Include the weighted clearance rate (latest year)." }
    population: { type: boolean, default: true, description: "Include the 2025 population estimate." }
