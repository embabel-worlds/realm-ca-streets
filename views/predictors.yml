# ── Correlation vs causation: the cross-lagged test ─────────────────────────
# A contemporaneous beta cannot say which way clearance and crime run — a
# swamped force solves less, and impunity may invite more. With three vintages
# of BOTH series the two stories make different predictions about ORDER, and
# order is checkable. Ottawa-Gatineau's parts join here (both registers carry
# the parts), so this sample is the ~41-area severity set, not the 39 of the
# predictor battery.
- name: ClearanceLeadsOrLags
  description: "Correlation or causation — which way does the clearance-crime association run? The cross-lagged test over every CMA, from the same national one-call series: does an EARLY change in the weighted clearance rate (2018-2021) precede the LATER change in crime severity (2021-2025) — the impunity path — or does an early severity change precede the later clearance change — the swamping path? Both lagged correlations side by side with confidence intervals and detectability, the same-window association for reference, and a least-squares fit of the later severity change on the early clearance change net of the 2021 severity level. Temporal precedence is NECESSARY for causation, never sufficient: a common cause moving both on a delay (drug markets, staffing, demographics) survives this test, 35 areas make only strong paths detectable (the six CMAs added to the survey after 2018 have no baseline and drop out), and the 2021 midpoint is the pandemic trough, a distortion both windows share because it is the only midpoint the source publishes. Police-reported severity and seriousness-weighted clearance throughout, StatCan 35-10-0026. Read beside WhatBestPredictsCanadianCrime: that view says the association exists; this one asks which side moves first."
  cypher: |
    MATCH (u:CaCmaSet {set:'canada'})-[:LISTS_CSI_THEN]->(o:CaCmaCsiThen)
    MATCH (u)-[:LISTS_CSI_MID]->(m:CaCmaCsiMid) WHERE m.vector = o.vector
    MATCH (u)-[:LISTS_CSI_NOW]->(n:CaCmaCsiNow) WHERE n.vector = o.vector
    WITH u, CASE o.vector
               WHEN '44312689' THEN 'Abbotsford-Mission, British Columbia'
               WHEN '52117770' THEN 'Barrie, Ontario'
               WHEN '1064948737' THEN 'Belleville-Quinte West, Ontario'
