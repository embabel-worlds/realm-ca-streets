# The crime-PREDICTION views — the realm-uk-streets crime-predictors pattern,
# rebuilt for Canada's CMA cross-section. The outcome is the LEVEL: each CMA's
# police-reported Crime Severity Index, latest year (national index, Canada
# 2006 = 100, so areas rank directly). Six predictors join it, each from a
# register that does not know the others exist: T1FF median family income,
# LFS unemployment, demographic-estimate age structure, population growth and
# size, and the weighted clearance rate — the policing axis Canada publishes
# and Britain does not.
#
# Every view below rides the SAME join pipeline and the SAME non-null gate, so
# the CMA set is identical everywhere (~39: Oshawa has no published CSI vector
# and Ottawa-Gatineau's police report the Ontario and Quebec parts separately,
# so the combined-CMA predictors find no severity row to join).
#
# The WDS vector -> CMA-name CASE maps are the established join mechanism for
# national one-call producers (see CanadaCrimeFactorBattery). These maps were
# GENERATED from the resolved vector sets - edit the producer vector lists and
# regenerate rather than hand-editing a WHEN arm.


- name: WhatBestPredictsCanadianCrime
  description: "What is the best PREDICTOR of police-reported crime severity across Canada's CMAs — income, joblessness, age structure, growth, clearance, or size? A least-squares fit of each CMA's Crime Severity Index (latest year, national index so areas compare directly) on median family income (T1FF 2023), the unemployment rate (LFS, 3-month average, seasonally adjusted, mid-2026), the share of residents aged 20-24 (demographic estimates 2025), population growth 2021-2025, the weighted clearance rate (share of reported crime solved, seriousness-weighted, latest year) and population, with STANDARDIZED betas so all six are directly comparable, honest R², and the CMAs furthest above and below their prediction by name. Joins five StatCan registers that never meet on one page: 35-10-0026 severity and clearance, 11-10-0009 income, 14-10-0459 labour force, 17-10-0148 demographics. Read a beta as strength of association ACROSS AREAS — a statement about places, never about the people in them; clearance is simultaneity on its face (solving crime may suppress it, and a swamped force solves less), so its coefficient reads as the impunity association, not an effect. Police-REPORTED severity throughout: a CMA can rank high by reporting more rather than suffering more. ~39 CMAs — Oshawa publishes no severity vector and Ottawa-Gatineau's parts are policed separately, so the combined CMA drops out; with n this small only strong associations are detectable, and R² is modest by design — the joinable open data holds economic and structural variables, not the policing, reporting and opportunity factors that drive much of the remainder."
