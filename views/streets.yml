# Saved views over the CaPlace joins. The headline views each join two or more
# national datasets that never meet anywhere else — the House of Commons does
# not publish census income, Statistics Canada does not publish who your MP is,
# and Environment Canada knows neither. The join at YOUR places is the product.
# Where the source is bilingual (Environment Canada), views return BOTH official
# wordings — columns suffixed Fr — so a French surface never re-translates.
#
# View names are GLOBALLY resolved across installed realms — `IncomeByParty`
# already belongs to realm-uk-streets, which is why the party view here is
# CaIncomeByParty (a collision this realm hit and fixed).
#
# CaPlaceDossier deliberately does NOT traverse HAS_ALERT: alerts have the
# shortest cache and their cold fan-out would put seconds on the app's first
# paint. Alert counts come from AlertsAtMyMPs, which owns that cost.

- name: CaPlaceDossier
  description: The FAST whole-picture row per watched Canadian place — coordinates for mapping, riding and sitting MP with party, photo, email and gender, Census 2021 population, median age, median household income, median dwelling value, worst current AQHI nearby, and current temperature and conditions (English and French). Deliberately excludes every StatCan-vector series (unemployment, crime severity, housing index, gas, population estimates — run StatcanAtMyPlaces) and the alert join (run AlertsAtMyMPs) — those sources are slower or rate-limited and must never sit on the first paint.
  params:
    limit:
      type: int
      default: 15
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_SEAT]->(s0:CaSeat)
    WITH p, collect(s0)[0] AS s
    OPTIONAL MATCH (p)-[:HAS_POPULATION]->(pop:CaPopulation)
    WITH p, s, max(toFloat(pop.value)) AS population
    OPTIONAL MATCH (p)-[:HAS_MEDIAN_AGE]->(ma:CaMedianAge)
    WITH p, s, population, max(toFloat(ma.value)) AS medianAge
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(inc:CaHouseholdIncome)
    WITH p, s, population, medianAge, max(toFloat(inc.value)) AS medianHouseholdIncome
    OPTIONAL MATCH (p)-[:HAS_DWELLING_VALUE]->(dv:CaDwellingValue)
    WITH p, s, population, medianAge, medianHouseholdIncome, max(toFloat(dv.value)) AS medianDwellingValue
    OPTIONAL MATCH (p)-[:HAS_AIR]->(a:AirQualityObs)
    WITH p, s, population, medianAge, medianHouseholdIncome, medianDwellingValue, max(toFloat(a.aqhi)) AS worstAqhi
    OPTIONAL MATCH (p)-[:HAS_WEATHER]->(w0:LocalWeather)
    WITH p, s, population, medianAge, medianHouseholdIncome, medianDwellingValue, worstAqhi, collect(w0)[0] AS w
    RETURN p.name AS place, p.city AS city, p.province AS province,
           p.postalCode AS postalCode,
           toFloat(p.latitude) AS latitude, toFloat(p.longitude) AS longitude,
           s.riding AS riding, s.mp AS mp, s.party AS party,
           s.photo AS photo, s.email AS email, s.gender AS gender,
           population, medianAge, medianHouseholdIncome, medianDwellingValue,
           worstAqhi,
           toFloat(w.temperature) AS temperatureC, w.condition AS condition,
           w.conditionFr AS conditionFr
    ORDER BY place LIMIT $limit

- name: WhoRepresentsMe
  description: EVERY elected representative at each watched place's postal code — MP, MPP/MLA/MNA, mayor and councillors, one row each, federal first. The combined 'who represents this address' record no single level of government publishes. Party is often empty at municipal level (non-partisan councils), and a missing councillor is Represent coverage, not a vacancy. A place added by NAME has no postal code and no rows here.
  params:
    limit:
      type: int
      default: 60
      description: "Maximum rows."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_REP]->(r:ElectedRep)
    RETURN p.name AS place, r.office AS office, r.name AS name,
           r.party AS party, r.district AS district, r.body AS body, r.email AS email
    ORDER BY place,
      CASE r.office WHEN 'MP' THEN 0 WHEN 'MPP' THEN 1 WHEN 'MLA' THEN 1
                    WHEN 'MNA' THEN 1 WHEN 'MHA' THEN 1 WHEN 'Mayor' THEN 2
                    ELSE 3 END
    LIMIT $limit

- name: SeatsAtMyPlaces
  description: The federal riding and sitting MP for each watched place — name, party, email and official photo URL, straight from the House of Commons record via Represent.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_SEAT]->(s:CaSeat)
    RETURN p.name AS place, s.riding AS riding, s.mp AS mp, s.party AS party,
           s.email AS email, s.photo AS photo
    ORDER BY place LIMIT $limit

- name: StatcanAtMyPlaces
  description: Every StatCan-vector figure per watched place in one BACKGROUND row — current unemployment (LFS, latest month, CMA/province), Crime Severity Index (annual), New Housing Price Index (latest month), average gas price (latest month), and the July-1 population estimate — each with the month/year and geography it describes. This view owns the rate-limited StatCan fan-out so CaPlaceDossier stays fast; expect occasional PRODUCER_ERROR warnings while statcan.gc.ca is throttling (HTTP 430) — the figures fill in as caches warm and then hold for a day (monthly series) or a week (annual).
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_UNEMPLOYMENT_NOW]->(un0:CaUnemploymentNow)
    WITH p, un0 ORDER BY un0.month DESC
    WITH p, collect(un0)[0] AS un
    OPTIONAL MATCH (p)-[:HAS_CRIME_SEVERITY]->(cs0:CaCrimeSeverity)
    WITH p, un, cs0 ORDER BY cs0.year DESC
    WITH p, un, collect(cs0)[0] AS cs
    OPTIONAL MATCH (p)-[:HAS_NHPI]->(n0:CaHousingPriceIndex)
    WITH p, un, cs, n0 ORDER BY n0.month DESC
    WITH p, un, cs, collect(n0)[0] AS nh
    OPTIONAL MATCH (p)-[:HAS_GAS]->(g0:CaGasPrice)
    WITH p, un, cs, nh, g0 ORDER BY g0.month DESC
    WITH p, un, cs, nh, collect(g0)[0] AS g
    OPTIONAL MATCH (p)-[:HAS_POP_NOW]->(pn0:CaPopulationNow)
    WITH p, un, cs, nh, g, pn0 ORDER BY pn0.year DESC
    WITH p, un, cs, nh, g, collect(pn0)[0] AS pn
    RETURN p.name AS place,
           toFloat(un.rate) AS unemploymentRate, un.month AS unemploymentMonth, p.lfsCma AS unemploymentArea,
           toFloat(cs.csi) AS crimeSeverityIndex, cs.year AS crimeSeverityYear, p.csiArea AS crimeSeverityArea,
           toFloat(nh.index) AS nhpiLatest, nh.month AS nhpiMonth, p.nhpiArea AS nhpiArea,
           toFloat(g.centsPerLitre) AS gasCentsPerLitre, g.month AS gasMonth, p.gasArea AS gasArea,
           toFloat(pn.population) AS populationNow, pn.year AS populationNowYear, p.popArea AS populationNowArea
    ORDER BY place LIMIT $limit

# ── The cross-source views — questions no single register answers ────────────

- name: CaIncomeByParty
  description: Census 2021 median household income of watched municipalities, grouped by the party of each place's sitting MP — 'what does a Liberal place earn vs a Conservative one', from Statistics Canada and the House of Commons, joined at your places. Averages of MUNICIPAL medians over the watchlist, not a national estimate — the description says whose places these are. (Named CaIncomeByParty because realm-uk-streets already owns IncomeByParty.)
  params:
    limit:
      type: int
      default: 10
      description: "Maximum parties."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_SEAT]->(s:CaSeat)
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    WITH p, s, max(toFloat(i.value)) AS income
    WHERE income IS NOT NULL
    RETURN s.party AS party, count(*) AS places,
           round(avg(income)) AS avgMedianHouseholdIncome,
           round(min(income)) AS lowest, round(max(income)) AS highest
    ORDER BY avgMedianHouseholdIncome DESC LIMIT $limit

- name: PartyLedger
  description: The full census ledger by MP party across watched places — average median household income, average median dwelling value, average CURRENT unemployment rate (LFS, latest month, CMA level) and average median age per party. StatCan's numbers under Parliament's colours; averages of municipal medians over YOUR watchlist.
  params:
    limit:
      type: int
      default: 10
      description: "Maximum parties."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_SEAT]->(s:CaSeat)
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    WITH p, s, max(toFloat(i.value)) AS income
    OPTIONAL MATCH (p)-[:HAS_DWELLING_VALUE]->(d:CaDwellingValue)
    WITH p, s, income, max(toFloat(d.value)) AS dwelling
    OPTIONAL MATCH (p)-[:HAS_UNEMPLOYMENT_NOW]->(u0:CaUnemploymentNow)
    WITH p, s, income, dwelling, u0 ORDER BY u0.month DESC
    WITH p, s, income, dwelling, collect(u0)[0] AS u
    WITH p, s, income, dwelling, toFloat(u.rate) AS unemployment
    OPTIONAL MATCH (p)-[:HAS_MEDIAN_AGE]->(ag:CaMedianAge)
    WITH s.party AS party, income, dwelling, unemployment, max(toFloat(ag.value)) AS medianAge
    RETURN party, count(*) AS places,
           round(avg(income)) AS avgMedianHouseholdIncome,
           round(avg(dwelling)) AS avgMedianDwellingValue,
           round(avg(unemployment) * 10) / 10.0 AS avgUnemploymentRate,
           round(avg(medianAge) * 10) / 10.0 AS avgMedianAge
    ORDER BY avgMedianHouseholdIncome DESC LIMIT $limit

- name: SeatsAndFortunes
  description: Each watched place's riding and sitting MP beside the municipality's census fortunes — household income, dwelling value and the affordability ratio — ranked by income. One row per place; the riding-to-census join neither Parliament nor StatCan publishes.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_SEAT]->(s:CaSeat)
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    WITH p, s, max(toFloat(i.value)) AS income
    OPTIONAL MATCH (p)-[:HAS_DWELLING_VALUE]->(d:CaDwellingValue)
    WITH p, s, income, max(toFloat(d.value)) AS dwelling
    RETURN p.name AS place, s.riding AS riding, s.mp AS mp, s.party AS party,
           income AS medianHouseholdIncome, dwelling AS medianDwellingValue,
           CASE WHEN income IS NULL OR income = 0 OR dwelling IS NULL THEN null
                ELSE round(10.0 * dwelling / income) / 10.0 END AS yearsOfIncomePerHome
    ORDER BY income IS NULL, income DESC LIMIT $limit

- name: SplitRepresentation
  description: Watched places whose FEDERAL and PROVINCIAL representatives come from different political families — MP party beside MPP/MLA/MNA/MHA party, with `aligned` computed on shared party stems (Liberal, Conservative, New Democratic, Green). Provincial parties are distinct organisations from their federal namesakes — alignment here means the NAME family matches, nothing more; Québec's CAQ/PQ never 'align' by this rule and that is honest.
  params:
    limit:
      type: int
      default: 30
      description: "Maximum rows."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_REP]->(f:ElectedRep {office:'MP'})
    MATCH (p)-[:HAS_REP]->(pr:ElectedRep)
    WHERE pr.office IN ['MPP','MLA','MNA','MHA']
    RETURN p.name AS place, f.name AS mp, f.party AS federalParty,
           pr.name AS provincialRep, pr.office AS provincialOffice, pr.party AS provincialParty,
           any(stem IN ['Liberal','Conservative','New Democratic','Green']
               WHERE f.party CONTAINS stem AND pr.party CONTAINS stem) AS aligned
    ORDER BY aligned, place LIMIT $limit

- name: AffordabilityGap
  description: Years of median household income needed to buy the median dwelling in each watched municipality — Census dwelling value over census household income, ranked least affordable first. Both figures are municipal medians (owner-estimated values, 2020 incomes); the RATIO is the comparable number, and no register publishes it.
  params:
    limit:
      type: int
      default: 15
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_DWELLING_VALUE]->(d:CaDwellingValue)
    WITH p, max(toFloat(d.value)) AS dwelling
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    WITH p, dwelling, max(toFloat(i.value)) AS income
    RETURN p.name AS place, p.city AS city, p.province AS province,
           dwelling AS medianDwellingValue, income AS medianHouseholdIncome,
           CASE WHEN income IS NULL OR income = 0 OR dwelling IS NULL THEN null
                ELSE round(10.0 * dwelling / income) / 10.0 END AS yearsOfIncomePerHome
    ORDER BY yearsOfIncomePerHome IS NULL, yearsOfIncomePerHome DESC
    LIMIT $limit

- name: CensusLeague
  description: Every census measure for every watched place in one comparable table — population, median age, median household income, median dwelling value, the CURRENT unemployment rate (StatCan LFS, latest month, CMA/province level) and the affordability ratio, ranked by income. Census figures are 2021 municipal values (incomes 2020); unemployment alone is live monthly data.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_POPULATION]->(pop:CaPopulation)
    WITH p, max(toFloat(pop.value)) AS population
    OPTIONAL MATCH (p)-[:HAS_MEDIAN_AGE]->(ma:CaMedianAge)
    WITH p, population, max(toFloat(ma.value)) AS medianAge
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    WITH p, population, medianAge, max(toFloat(i.value)) AS income
    OPTIONAL MATCH (p)-[:HAS_DWELLING_VALUE]->(d:CaDwellingValue)
    WITH p, population, medianAge, income, max(toFloat(d.value)) AS dwelling
    OPTIONAL MATCH (p)-[:HAS_UNEMPLOYMENT_NOW]->(u0:CaUnemploymentNow)
    WITH p, population, medianAge, income, dwelling, u0 ORDER BY u0.month DESC
    WITH p, population, medianAge, income, dwelling, collect(u0)[0] AS u
    RETURN p.name AS place, p.city AS city, p.province AS province,
           population, medianAge, income AS medianHouseholdIncome,
           dwelling AS medianDwellingValue,
           toFloat(u.rate) AS unemploymentRate, u.month AS unemploymentMonth,
           CASE WHEN income IS NULL OR income = 0 OR dwelling IS NULL THEN null
                ELSE round(10.0 * dwelling / income) / 10.0 END AS yearsOfIncomePerHome
    ORDER BY income IS NULL, income DESC LIMIT $limit

- name: AirVsIncome
  description: The worst current AQHI near each watched place beside the municipality's median household income — 'do richer places breathe easier air right now', Environment Canada joined to Statistics Canada. AQHI is a live snapshot, not an annual average; a null means no monitoring station within the wide box, a coverage fact (the federal AQHI network does not include Québec).
  params:
    limit:
      type: int
      default: 15
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_AIR]->(a:AirQualityObs)
    WITH p, max(toFloat(a.aqhi)) AS worstAqhi
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    RETURN p.name AS place, p.city AS city, worstAqhi,
           max(toFloat(i.value)) AS medianHouseholdIncome
    ORDER BY worstAqhi IS NULL, worstAqhi DESC LIMIT $limit

- name: AlertsAtMyMPs
  description: Active Environment Canada weather alerts at watched places, joined to the riding and sitting MP — 'which MP's constituents are under an official alert right now'. Alert names in both official languages. A live join of Environment Canada to the House of Commons that neither publishes. Every place returns at least one row (null alert = none there), so an app can derive per-place counts. This view owns the short-TTL alert fan-out — expect the occasional slower cold read.
  params:
    limit:
      type: int
      default: 30
      description: "Maximum rows."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_ALERT]->(al:CaWeatherAlert)
    WITH p, al
    OPTIONAL MATCH (p)-[:HAS_SEAT]->(s:CaSeat)
    WITH p, al, collect(s)[0] AS s
    RETURN p.name AS place, al.alertName AS alert, al.alertNameFr AS alertFr,
           al.alertType AS type, s.riding AS riding, s.mp AS mp, s.party AS party,
           al.expires AS expires
    ORDER BY CASE al.alertType WHEN 'warning' THEN 0 WHEN 'watch' THEN 1
                               WHEN 'advisory' THEN 2 ELSE 3 END, place
    LIMIT $limit

- name: CaCrimeVsIncome
  description: Each watched place's police-reported Crime Severity Index (latest year, CMA level, Canada-2006=100 — directly comparable across areas) beside the municipality's median household income and the sitting MP's party — StatCan's crime and income series joined to the House of Commons record at your places, ranked most-severe first. CSI is annual (latest 2025); income is Census 2020.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_CRIME_SEVERITY]->(c0:CaCrimeSeverity)
    WITH p, c0 ORDER BY c0.year DESC
    WITH p, collect(c0)[0] AS c
    OPTIONAL MATCH (p)-[:HAS_HOUSEHOLD_INCOME]->(i:CaHouseholdIncome)
    WITH p, c, max(toFloat(i.value)) AS income
    OPTIONAL MATCH (p)-[:HAS_SEAT]->(s0:CaSeat)
    WITH p, c, income, collect(s0)[0] AS s
    RETURN p.name AS place, p.csiArea AS area, toFloat(c.csi) AS crimeSeverityIndex,
           c.year AS csiYear, income AS medianHouseholdIncome, s.mp AS mp, s.party AS party
    ORDER BY crimeSeverityIndex IS NULL, crimeSeverityIndex DESC LIMIT $limit

- name: CaCrimeByParty
  description: Average Crime Severity Index (latest year per place, CMA level) grouped by the party of each place's sitting MP — 'is crime more severe where party X holds the seat', across YOUR watchlist. An association over your places, never a causal claim about any member.
  params:
    limit:
      type: int
      default: 10
      description: "Maximum parties."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_CRIME_SEVERITY]->(c0:CaCrimeSeverity)
    WITH p, c0 ORDER BY c0.year DESC
    WITH p, collect(c0)[0] AS c
    OPTIONAL MATCH (p)-[:HAS_SEAT]->(s0:CaSeat)
    WITH p, c, collect(s0)[0] AS s
    WITH s.party AS party, toFloat(c.csi) AS csi
    WHERE csi IS NOT NULL AND party IS NOT NULL
    RETURN party, count(*) AS places, round(avg(csi) * 10) / 10.0 AS avgCrimeSeverityIndex,
           round(min(csi) * 10) / 10.0 AS lowest, round(max(csi) * 10) / 10.0 AS highest
    ORDER BY avgCrimeSeverityIndex DESC LIMIT $limit

- name: HousingHeat
  description: Where new-home prices are moving fastest — each watched place's New Housing Price Index (latest month) with its year-over-year percent change, beside the census median dwelling value and the sitting MP's party, hottest first. The index level is StatCan's; the year-over-year arithmetic is computed in this view from the same series.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_NHPI]->(n0:CaHousingPriceIndex)
    WITH p, n0 ORDER BY n0.month DESC
    WITH p, collect(n0) AS series
    WITH p, series[0] AS latest, series[12] AS yearAgo
    OPTIONAL MATCH (p)-[:HAS_DWELLING_VALUE]->(d:CaDwellingValue)
    WITH p, latest, yearAgo, max(toFloat(d.value)) AS dwelling
    OPTIONAL MATCH (p)-[:HAS_SEAT]->(s0:CaSeat)
    WITH p, latest, yearAgo, dwelling, collect(s0)[0] AS s
    RETURN p.name AS place, p.nhpiArea AS area,
           toFloat(latest.index) AS nhpiLatest, latest.month AS month,
           CASE WHEN yearAgo IS NULL OR toFloat(yearAgo.index) = 0 THEN null
                ELSE round((toFloat(latest.index) / toFloat(yearAgo.index) - 1) * 1000) / 10.0 END AS yoyPct,
           dwelling AS medianDwellingValue, s.mp AS mp, s.party AS party
    ORDER BY yoyPct IS NULL, yoyPct DESC LIMIT $limit

- name: GasAtMyPlaces
  description: The latest monthly average pump price (regular unleaded, self-serve, cents per litre) at each watched place's city, cheapest first — StatCan table 18-10-0001. Coverage is 18 large centres; a missing place has no covered city nearby, not free gas.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_GAS]->(g0:CaGasPrice)
    WITH p, g0 ORDER BY g0.month DESC
    WITH p, collect(g0)[0] AS g
    RETURN p.name AS place, p.gasArea AS area,
           toFloat(g.centsPerLitre) AS centsPerLitre, g.month AS month
    ORDER BY centsPerLitre ASC LIMIT $limit

- name: BoomtownLedger
  description: The growth-versus-supply ledger per watched CMA — people ADDED (July-1 population estimates, 2021 to latest) against housing UNITS STARTED over the same window (CMHC), as a people-per-new-home ratio, beside the New Housing Price Index year-over-year and the sitting MP's party. Above ~2.5 people per unit (the average household), building is falling behind growth. The ratio is computed here; every input is the publisher's own figure.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum areas."
  cypher: |
    MATCH (p:CaPlace)
    WHERE p.popVector IS NOT NULL AND p.startsVector IS NOT NULL
    OPTIONAL MATCH (p)-[:HAS_POP_NOW]->(n:CaPopulationNow)
    WITH p, n ORDER BY n.year
    WITH p, collect(n) AS pops
    WITH p, toFloat(pops[0].population) AS popStart, toFloat(pops[-1].population) AS popEnd,
         pops[0].year AS fromYear, pops[-1].year AS toYear
    OPTIONAL MATCH (p)-[:HAS_HOUSING_STARTS]->(h:CaHousingStart)
    WHERE h.month >= '2021-07-01'
    WITH p, popStart, popEnd, fromYear, toYear, sum(toFloat(h.starts)) AS unitsStarted
    OPTIONAL MATCH (p)-[:HAS_NHPI]->(x:CaHousingPriceIndex)
    WITH p, popStart, popEnd, fromYear, toYear, unitsStarted, x ORDER BY x.month DESC
    WITH p, popStart, popEnd, fromYear, toYear, unitsStarted, collect(x) AS nh
    OPTIONAL MATCH (p)-[:HAS_SEAT]->(s0:CaSeat)
    WITH p, popStart, popEnd, fromYear, toYear, unitsStarted, nh, collect(s0)[0] AS s
    WITH DISTINCT p.startsArea AS area, popStart, popEnd, fromYear, toYear, unitsStarted,
         toFloat(nh[0].index) AS nhpiLatest,
         CASE WHEN size(nh) > 12 AND toFloat(nh[12].index) > 0
              THEN round((toFloat(nh[0].index) / toFloat(nh[12].index) - 1) * 1000) / 10.0 END AS nhpiYoyPct,
         s.mp AS mp, s.party AS party
    WHERE popStart IS NOT NULL AND unitsStarted > 0
    RETURN area, round(popEnd - popStart) AS peopleAdded,
           round((popEnd / popStart - 1) * 1000) / 10.0 AS growthPct,
           round(unitsStarted) AS unitsStarted,
           round((popEnd - popStart) / unitsStarted * 100) / 100.0 AS peoplePerNewHome,
           nhpiYoyPct, mp, party
    ORDER BY peoplePerNewHome DESC LIMIT $limit

- name: WhoGotSafer
  description: Each watched CMA's police-reported Crime Severity Index at the start and end of the stored series (2018 to latest year) with the percent change — who actually got safer, on the publisher's own nationally comparable index (Canada 2006 = 100). A change in POLICE-REPORTED severity, which reflects reporting and enforcement as well as crime; say so.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum areas."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_CRIME_SEVERITY]->(c:CaCrimeSeverity)
    WITH DISTINCT p.csiArea AS area, c.year AS year, toFloat(c.csi) AS csi
    ORDER BY area, year
    WITH area, collect({year: year, csi: csi}) AS series
    WITH area, series[0] AS first, series[-1] AS last
    WHERE first.csi > 0
    RETURN area, first.year AS fromYear, first.csi AS csiThen,
           last.year AS toYear, last.csi AS csiNow,
           round((last.csi / first.csi - 1) * 1000) / 10.0 AS changePct
    ORDER BY changePct ASC LIMIT $limit

# ── Single-source live views ─────────────────────────────────────────────────

- name: MorningCanada
  description: The live face of every watched place at the same instant, coast to coast — current temperature and conditions (both official languages), worst AQHI with its risk band, and the count of active alerts. The one-view morning briefing; run it and read down.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_WEATHER]->(w0:LocalWeather)
    WITH p, collect(w0)[0] AS w
    OPTIONAL MATCH (p)-[:HAS_AIR]->(a:AirQualityObs)
    WITH p, w, max(toFloat(a.aqhi)) AS worstAqhi
    OPTIONAL MATCH (p)-[:HAS_ALERT]->(al:CaWeatherAlert)
    RETURN p.name AS place, p.province AS province,
           toFloat(w.temperature) AS temperatureC,
           w.condition AS condition, w.conditionFr AS conditionFr,
           worstAqhi,
           CASE WHEN worstAqhi IS NULL THEN null
                WHEN worstAqhi <= 3 THEN 'Low risk' WHEN worstAqhi <= 6 THEN 'Moderate risk'
                WHEN worstAqhi <= 10 THEN 'High risk' ELSE 'Very high risk' END AS airRisk,
           count(al) AS activeAlerts
    ORDER BY temperatureC IS NULL, temperatureC DESC LIMIT $limit

- name: AirQualityNow
  description: The latest Air Quality Health Index at every monitoring station near watched places, worst first, with the official risk band and the station's name in both official languages. 1-3 low, 4-6 moderate, 7-10 high, 10+ very high. No station within the wide box means no row — coverage, not clean air (the federal AQHI network does not include Québec).
  params:
    limit:
      type: int
      default: 30
      description: "Maximum station rows."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_AIR]->(a:AirQualityObs)
    WITH p, a, toFloat(a.aqhi) AS aqhi
    RETURN p.name AS place, a.station AS station, a.stationFr AS stationFr, aqhi,
           CASE WHEN aqhi <= 3 THEN 'Low risk' WHEN aqhi <= 6 THEN 'Moderate risk'
                WHEN aqhi <= 10 THEN 'High risk' ELSE 'Very high risk' END AS risk,
           a.observedAt AS observedAt
    ORDER BY aqhi DESC LIMIT $limit

- name: RiversNearMe
  description: The LATEST reading from each river gauge near watched places — level in metres on the station's own datum, discharge where measured. Compare a station against itself over time, never one river's level against another's.
  params:
    limit:
      type: int
      default: 30
      description: "Maximum station rows."
  cypher: |
    MATCH (p:CaPlace)-[:HAS_RIVER]->(r:RiverReading)
    WITH p, r ORDER BY r.at DESC
    WITH p, r.stationNumber AS stationNumber, collect(r)[0] AS latest
    RETURN p.name AS place, latest.station AS station,
           toFloat(latest.level) AS levelMetres,
           toFloat(latest.discharge) AS dischargeM3s, latest.at AS readAt
    ORDER BY place, station LIMIT $limit

- name: WeatherAcrossMyPlaces
  description: Current temperature, conditions (both official languages) and humidity at the weather.gc.ca city page nearest each watched place, with any active alert count — the same instant across the whole watchlist, coast to coast.
  params:
    limit:
      type: int
      default: 20
      description: "Maximum places."
  cypher: |
    MATCH (p:CaPlace)
    OPTIONAL MATCH (p)-[:HAS_WEATHER]->(w0:LocalWeather)
    WITH p, collect(w0)[0] AS w
    OPTIONAL MATCH (p)-[:HAS_ALERT]->(al:CaWeatherAlert)
    RETURN p.name AS place, p.province AS province, w.site AS site,
           toFloat(w.temperature) AS temperatureC, w.condition AS condition,
           w.conditionFr AS conditionFr,
           toFloat(w.humidity) AS humidityPct, count(al) AS activeAlerts
    ORDER BY temperatureC DESC LIMIT $limit
