             WHEN '52117752' THEN 'Peterborough, Ontario'
             WHEN '44312521' THEN 'Québec, Quebec'
             WHEN '1593151892' THEN 'Red Deer, Alberta'
             WHEN '44312641' THEN 'Regina, Saskatchewan'
             WHEN '44312515' THEN 'Saguenay, Quebec'
             WHEN '44312503' THEN 'Saint John, New Brunswick'
             WHEN '44312647' THEN 'Saskatoon, Saskatchewan'
             WHEN '44312527' THEN 'Sherbrooke, Quebec'
             WHEN '44312473' THEN 'St. John\'s, Newfoundland and Labrador'
             WHEN '44312581' THEN 'St.Catharines-Niagara, Ontario'
             WHEN '44312611' THEN 'Thunder Bay, Ontario'
             WHEN '44312569' THEN 'Toronto, Ontario'
             WHEN '44312533' THEN 'Trois-Rivières, Quebec'
             WHEN '44312677' THEN 'Vancouver, British Columbia'
             WHEN '44312683' THEN 'Victoria, British Columbia'
             WHEN '44312599' THEN 'Windsor, Ontario'
             WHEN '44312629' THEN 'Winnipeg, Manitoba'
             ELSE r.vector END AS cma,
           round(r.csiNow * 10) / 10.0 AS csiNow, round(r.csiThen * 10) / 10.0 AS csi2018,
           round(changePct * 10) / 10.0 AS changePct,
           round(zNow * 100) / 100.0 AS sigmasFromMeanNow,
           round(zChange * 100) / 100.0 AS sigmasFromMeanChange,
           CASE WHEN zNow > 1.5 OR zNow < -1.5 OR zChange > 1.5 OR zChange < -1.5 THEN 'OUTLIER' ELSE '' END AS flag,
