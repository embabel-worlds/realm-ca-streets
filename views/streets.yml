             WHEN '1064948755' THEN 'Lethbridge, Alberta'
             WHEN '44312593' THEN 'London, Ontario'
             WHEN '52117746' THEN 'Moncton, New Brunswick'
             WHEN '44312539' THEN 'Montréal, Quebec'
