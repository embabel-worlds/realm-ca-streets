- name: CanadaCrimeMomentumStat
  description: The momentum question answered IN the engine — correlate() over every CMA's first-half (2018-21) versus second-half (2021-25) severity change, returning r with its confidence interval and a detectability verdict. The companion row view is CanadaCrimeMomentum; this is the one-row statistical answer.
  cypher: |
    MATCH (u:CaCmaSet {set:'canada'})-[:LISTS_CSI_THEN]->(o:CaCmaCsiThen)
    MATCH (u)-[:LISTS_CSI_MID]->(m:CaCmaCsiMid) WHERE m.vector = o.vector
    MATCH (u)-[:LISTS_CSI_NOW]->(n:CaCmaCsiNow) WHERE n.vector = o.vector
    WITH toFloat(o.csi) AS c18, toFloat(m.csi) AS c21, toFloat(n.csi) AS c25
    WHERE c18 > 0 AND c21 > 0 AND c25 IS NOT NULL
    RETURN correlate((c21 / c18 - 1) * 100, (c25 / c21 - 1) * 100) AS momentum, count(*) AS cmas

