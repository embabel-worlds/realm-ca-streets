  description: "Did Canadian crime turn more VIOLENT even where it shrank? Each CMA's violent-severity change 2018-2025 beside its total-severity change, the correlation between the two, and by name: the cities where the violent index ROSE while total severity FELL — the recomposition no single index shows. A strong positive correlation with an empty recomposition list kills the hypothesis (violence just tracks totals); a populated list is the story. ~35 CMAs with a 2018 baseline; police-reported severity throughout."
