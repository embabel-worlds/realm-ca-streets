- name: TheTwoSolitudesOfCrime
  description: "Is Canada's crime geography just REGION? A West indicator (BC, Alberta, Saskatchewan, Manitoba) and a Quebec indicator, each correlated with severity alone, then fitted together beside the clearance rate. Read the R² against WhatBestPredictsCanadianCrime's six socioeconomic predictors: if two regional dummies plus clearance explain more than income, jobs, age, growth and size combined, the between-region differences — history, institutions, reporting culture — carry the map, and within-region variation is the residual story. The Quebec discount in particular is entangled with reporting propensity: Quebecers may report less to police, which lowers a REPORTED-crime index without lowering crime. Binary betas understate two-group gaps; read direction and survival. ~41 areas; association, never causation, about places never people."
