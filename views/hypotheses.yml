    RETURN round(avg(premium18), 1) AS meanViolentPremium2018,
           round(avg(premium25), 1) AS meanViolentPremium2025,
           correlate(clearChange, premiumChange) AS collapseWidensPremium,
           [x IN collect(CASE WHEN clearChange <= -5 AND violClearChange >= clearChange / 2.0
                 THEN cma + ' (overall ' + toString(round(clearChange, 1)) + ' pts, violent ' + toString(round(violClearChange, 1)) + ' pts)' END)
            WHERE x IS NOT NULL] AS protectedViolentSolving,
           count(*) AS cmas


