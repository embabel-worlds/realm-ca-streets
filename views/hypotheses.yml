           count(*) AS cmas

# H3 — IMPUNITY THRESHOLD. The clearance-crime association is nonlinear:
# it lives in the low-clearance half and vanishes where clearance is decent.
- name: ImpunityThreshold
  description: "Is the clearance-crime association a THRESHOLD effect? The CMAs split at the national median clearance rate, and clearance correlated with severity WITHIN each half — if the association is concentrated below the median (where impunity is worst) and absent above it, the relationship is nonlinear and the policy reading changes: gains matter most where solving is rarest. Two detectable halves of similar strength kill the threshold reading; two undetectable halves mean the pooled association lives BETWEEN the halves, not within them — each verdict is informative. Halved samples (~20 each) make detection hard; expect wide intervals. Association, never causation."
  cypher: |
    MATCH (u:CaCmaSet {set:'canada'})-[:LISTS_CSI_NOW]->(n:CaCmaCsiNow)
