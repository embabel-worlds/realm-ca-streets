           WHEN '1589907684' THEN 'Lethbridge, Alberta'
           WHEN '1589891124' THEN 'London, Ontario'
           WHEN '1589866284' THEN 'Moncton, New Brunswick'
           WHEN '1589878014' THEN 'Montréal, Quebec'
           WHEN '1589919414' THEN 'Nanaimo, British Columbia'
           WHEN '1589886984' THEN 'Oshawa, Ontario'
           WHEN '1589930454' THEN 'Ottawa-Gatineau, Ontario/Quebec'
           WHEN '1589885949' THEN 'Peterborough, Ontario'
           WHEN '1589873184' THEN 'Québec, Quebec'
           WHEN '1589909754' THEN 'Red Deer, Alberta'
           WHEN '1589902164' THEN 'Regina, Saskatchewan'
           WHEN '1589871804' THEN 'Saguenay, Quebec'
           WHEN '1589866629' THEN 'Saint John, New Brunswick'
           WHEN '1589903544' THEN 'Saskatoon, Saskatchewan'
           WHEN '1589874564' THEN 'Sherbrooke, Quebec'
           WHEN '1589888364' THEN 'St. Catharines-Niagara, Ontario'
           WHEN '1589858694' THEN 'St. John\'s, Newfoundland and Labrador'
           WHEN '1589896644' THEN 'Thunder Bay, Ontario'
           WHEN '1589887674' THEN 'Toronto, Ontario'
           WHEN '1589875599' THEN 'Trois-Rivières, Quebec'
           WHEN '1589917689' THEN 'Vancouver, British Columbia'
           WHEN '1589918379' THEN 'Victoria, British Columbia'
           WHEN '1589891814' THEN 'Windsor, Ontario'
           WHEN '1589898714' THEN 'Winnipeg, Manitoba'
           ELSE y1.vector END AS cma,
         toFloat(y1.value) AS yp21, toFloat(y2.value) AS yp25
    WHERE yp21 IS NOT NULL AND yp25 IS NOT NULL
    MATCH (u)-[:LISTS_POP_2021]->(pa:CaCmaPop2021)
    MATCH (u)-[:LISTS_POP_2025]->(pb:CaCmaPop2025) WHERE pb.vector = pa.vector
    WITH u, cma, yp21, yp25, pa, pb, CASE pa.vector
           WHEN '1589917362' THEN 'Abbotsford-Mission, British Columbia'
           WHEN '1589893902' THEN 'Barrie, Ontario'
           WHEN '1589884932' THEN 'Belleville-Quinte West, Ontario'
           WHEN '1589889072' THEN 'Brantford, Ontario'
           WHEN '1589908737' THEN 'Calgary, Alberta'
           WHEN '1589917017' THEN 'Chilliwack, British Columbia'
           WHEN '1589876307' THEN 'Drummondville, Quebec'
           WHEN '1589911152' THEN 'Edmonton, Alberta'
           WHEN '1589866992' THEN 'Fredericton, New Brunswick'
           WHEN '1589895282' THEN 'Greater Sudbury, Ontario'
           WHEN '1589890452' THEN 'Guelph, Ontario'
           WHEN '1589863197' THEN 'Halifax, Nova Scotia'
           WHEN '1589888037' THEN 'Hamilton, Ontario'
           WHEN '1589916672' THEN 'Kamloops, British Columbia'
           WHEN '1589915637' THEN 'Kelowna, British Columbia'
           WHEN '1589884587' THEN 'Kingston, Ontario'
           WHEN '1589888727' THEN 'Kitchener-Cambridge-Waterloo, Ontario'
           WHEN '1589907702' THEN 'Lethbridge, Alberta'
           WHEN '1589891142' THEN 'London, Ontario'
           WHEN '1589866302' THEN 'Moncton, New Brunswick'
           WHEN '1589878032' THEN 'Montréal, Quebec'
           WHEN '1589919432' THEN 'Nanaimo, British Columbia'
           WHEN '1589887002' THEN 'Oshawa, Ontario'
           WHEN '1589930472' THEN 'Ottawa-Gatineau, Ontario/Quebec'
           WHEN '1589885967' THEN 'Peterborough, Ontario'
           WHEN '1589873202' THEN 'Québec, Quebec'
           WHEN '1589909772' THEN 'Red Deer, Alberta'
           WHEN '1589902182' THEN 'Regina, Saskatchewan'
           WHEN '1589871822' THEN 'Saguenay, Quebec'
           WHEN '1589866647' THEN 'Saint John, New Brunswick'
           WHEN '1589903562' THEN 'Saskatoon, Saskatchewan'
           WHEN '1589874582' THEN 'Sherbrooke, Quebec'
           WHEN '1589888382' THEN 'St. Catharines-Niagara, Ontario'
           WHEN '1589858712' THEN 'St. John\'s, Newfoundland and Labrador'
           WHEN '1589896662' THEN 'Thunder Bay, Ontario'
           WHEN '1589887692' THEN 'Toronto, Ontario'
           WHEN '1589875617' THEN 'Trois-Rivières, Quebec'
           WHEN '1589917707' THEN 'Vancouver, British Columbia'
           WHEN '1589918397' THEN 'Victoria, British Columbia'
           WHEN '1589891832' THEN 'Windsor, Ontario'
           WHEN '1589898732' THEN 'Winnipeg, Manitoba'
           ELSE pa.vector END AS popCma
    WHERE popCma = cma
    WITH u, cma,
         (yp25 / toFloat(pb.population) - yp21 / toFloat(pa.population)) * 100 AS shareChangePts
    MATCH (u)-[:LISTS_VIOLENT_THEN]->(vt:CaCmaViolentThen)
    MATCH (u)-[:LISTS_VIOLENT_NOW]->(vn:CaCmaViolentNow) WHERE vn.vector = vt.vector
    WITH u, cma, shareChangePts, vt, vn, CASE vt.vector
           WHEN '44312691' THEN 'Abbotsford-Mission, British Columbia'
           WHEN '52117772' THEN 'Barrie, Ontario'
           WHEN '1064948739' THEN 'Belleville-Quinte West, Ontario'
           WHEN '52117760' THEN 'Brantford, Ontario'
           WHEN '44312661' THEN 'Calgary, Alberta'
           WHEN '1593151939' THEN 'Chilliwack, British Columbia'
           WHEN '1593151885' THEN 'Drummondville, Quebec'
           WHEN '44312667' THEN 'Edmonton, Alberta'
           WHEN '1593151867' THEN 'Fredericton, New Brunswick'
           WHEN '44312607' THEN 'Greater Sudbury, Ontario'
           WHEN '52117766' THEN 'Guelph, Ontario'
           WHEN '44312493' THEN 'Halifax, Nova Scotia'
           WHEN '44312577' THEN 'Hamilton, Ontario'
           WHEN '1593151921' THEN 'Kamloops, British Columbia'
           WHEN '52117778' THEN 'Kelowna, British Columbia'
           WHEN '44312619' THEN 'Kingston, Ontario'
           WHEN '44312589' THEN 'Kitchener-Cambridge-Waterloo, Ontario'
           WHEN '1064948757' THEN 'Lethbridge, Alberta'
           WHEN '44312595' THEN 'London, Ontario'
           WHEN '52117748' THEN 'Moncton, New Brunswick'
           WHEN '44312541' THEN 'Montréal, Quebec'
           WHEN '1593151957' THEN 'Nanaimo, British Columbia'
           WHEN '44312565' THEN 'Ottawa-Gatineau, Ontario part'
           WHEN '44312547' THEN 'Ottawa-Gatineau, Quebec part'
           WHEN '52117754' THEN 'Peterborough, Ontario'
           WHEN '44312523' THEN 'Québec, Quebec'
           WHEN '1593151903' THEN 'Red Deer, Alberta'
           WHEN '44312643' THEN 'Regina, Saskatchewan'
           WHEN '44312517' THEN 'Saguenay, Quebec'
           WHEN '44312505' THEN 'Saint John, New Brunswick'
           WHEN '44312649' THEN 'Saskatoon, Saskatchewan'
           WHEN '44312529' THEN 'Sherbrooke, Quebec'
           WHEN '44312583' THEN 'St. Catharines-Niagara, Ontario'
           WHEN '44312475' THEN 'St. John\'s, Newfoundland and Labrador'
           WHEN '44312613' THEN 'Thunder Bay, Ontario'
           WHEN '44312571' THEN 'Toronto, Ontario'
           WHEN '44312535' THEN 'Trois-Rivières, Quebec'
           WHEN '44312679' THEN 'Vancouver, British Columbia'
           WHEN '44312685' THEN 'Victoria, British Columbia'
           WHEN '44312601' THEN 'Windsor, Ontario'
           WHEN '44312631' THEN 'Winnipeg, Manitoba'
           ELSE vt.vector END AS violCma
    WHERE violCma = cma AND toFloat(vt.value) > 0
    WITH u, cma, shareChangePts,
         (toFloat(vn.value) / toFloat(vt.value) - 1) * 100 AS violentChange
    MATCH (u)-[:LISTS_CSI_THEN]->(o:CaCmaCsiThen)
    MATCH (u)-[:LISTS_CSI_NOW]->(n:CaCmaCsiNow) WHERE n.vector = o.vector
    WITH cma, shareChangePts, violentChange, o, n, CASE o.vector
           WHEN '44312689' THEN 'Abbotsford-Mission, British Columbia'
           WHEN '52117770' THEN 'Barrie, Ontario'
           WHEN '1064948737' THEN 'Belleville-Quinte West, Ontario'
           WHEN '52117758' THEN 'Brantford, Ontario'
           WHEN '44312659' THEN 'Calgary, Alberta'
           WHEN '1593151928' THEN 'Chilliwack, British Columbia'
           WHEN '1593151874' THEN 'Drummondville, Quebec'
           WHEN '44312665' THEN 'Edmonton, Alberta'
           WHEN '1593151856' THEN 'Fredericton, New Brunswick'
           WHEN '44312605' THEN 'Greater Sudbury, Ontario'
           WHEN '52117764' THEN 'Guelph, Ontario'
           WHEN '44312491' THEN 'Halifax, Nova Scotia'
           WHEN '44312575' THEN 'Hamilton, Ontario'
           WHEN '1593151910' THEN 'Kamloops, British Columbia'
           WHEN '52117776' THEN 'Kelowna, British Columbia'
           WHEN '44312617' THEN 'Kingston, Ontario'
           WHEN '44312587' THEN 'Kitchener-Cambridge-Waterloo, Ontario'
           WHEN '1064948755' THEN 'Lethbridge, Alberta'
           WHEN '44312593' THEN 'London, Ontario'
           WHEN '52117746' THEN 'Moncton, New Brunswick'
           WHEN '44312539' THEN 'Montréal, Quebec'
           WHEN '1593151946' THEN 'Nanaimo, British Columbia'
           WHEN '44312563' THEN 'Ottawa-Gatineau, Ontario part'
           WHEN '44312545' THEN 'Ottawa-Gatineau, Quebec part'
           WHEN '52117752' THEN 'Peterborough, Ontario'
           WHEN '44312521' THEN 'Québec, Quebec'
           WHEN '1593151892' THEN 'Red Deer, Alberta'
           WHEN '44312641' THEN 'Regina, Saskatchewan'
           WHEN '44312515' THEN 'Saguenay, Quebec'
           WHEN '44312503' THEN 'Saint John, New Brunswick'
           WHEN '44312647' THEN 'Saskatoon, Saskatchewan'
           WHEN '44312527' THEN 'Sherbrooke, Quebec'
           WHEN '44312581' THEN 'St. Catharines-Niagara, Ontario'
           WHEN '44312473' THEN 'St. John\'s, Newfoundland and Labrador'
           WHEN '44312611' THEN 'Thunder Bay, Ontario'
           WHEN '44312569' THEN 'Toronto, Ontario'
           WHEN '44312533' THEN 'Trois-Rivières, Quebec'
           WHEN '44312677' THEN 'Vancouver, British Columbia'
           WHEN '44312683' THEN 'Victoria, British Columbia'
           WHEN '44312599' THEN 'Windsor, Ontario'
           WHEN '44312629' THEN 'Winnipeg, Manitoba'
           ELSE o.vector END AS csiCma
    WHERE csiCma = cma AND toFloat(o.csi) > 0
    WITH cma, shareChangePts, violentChange,
         (toFloat(n.csi) / toFloat(o.csi) - 1) * 100 AS totalChange
    RETURN correlate(shareChangePts, violentChange) AS cohortWaveVsViolence,
           correlate(shareChangePts, totalChange) AS cohortWaveVsTotal,
           regress([shareChangePts], violentChange, cma) AS model,
           count(*) AS cmas
