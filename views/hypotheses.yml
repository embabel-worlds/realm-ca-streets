# Seven hypotheses, one view each. The discipline: every view names its claim,
# its test, and what a NULL verdict means — a hypothesis that dies here died in
# public, against official figures, reproducibly. Written 2026-09-15; the maps
# are generated from the predictor views' vector sets.

# H1 — CONVERGENCE. High-crime cities revert toward the pack (beta), and the
# spread between cities narrows (sigma, as IQR over median).
- name: CanadaCrimeConvergence
  description: "Do Canada's high-crime cities fall back toward the pack? Beta-convergence — the correlation between a CMA's 2018 severity LEVEL and its 2018-2025 severity CHANGE (negative and detectable = reversion to the mean) with the fitted model and the cities that defied it by name — beside sigma-convergence: the relative spread of severity (interquartile range over median) in 2018 and in 2025. Reversion plus a narrowing spread reads as genuine convergence; reversion with a stable spread is ordinary regression to the mean and no more. 35 CMAs (the six added to the survey after 2018 have no baseline). Police-reported severity; association, never causation."
  cypher: |
    MATCH (u:CaCmaSet {set:'canada'})-[:LISTS_CSI_THEN]->(o:CaCmaCsiThen)
    MATCH (u)-[:LISTS_CSI_NOW]->(n:CaCmaCsiNow) WHERE n.vector = o.vector
    WITH CASE o.vector
           WHEN '44312689' THEN 'Abbotsford-Mission, British Columbia'
           WHEN '52117770' THEN 'Barrie, Ontario'
           WHEN '1064948737' THEN 'Belleville-Quinte West, Ontario'
           WHEN '52117758' THEN 'Brantford, Ontario'
           WHEN '44312659' THEN 'Calgary, Alberta'
           WHEN '1593151928' THEN 'Chilliwack, British Columbia'
           WHEN '1593151874' THEN 'Drummondville, Quebec'
           WHEN '44312665' THEN 'Edmonton, Alberta'
           WHEN '1593151856' THEN 'Fredericton, New Brunswick'
           WHEN '44312605' THEN 'Greater Sudbury, Ontario'
           WHEN '52117764' THEN 'Guelph, Ontario'
           WHEN '44312491' THEN 'Halifax, Nova Scotia'
           WHEN '44312575' THEN 'Hamilton, Ontario'
           WHEN '1593151910' THEN 'Kamloops, British Columbia'
           WHEN '52117776' THEN 'Kelowna, British Columbia'
           WHEN '44312617' THEN 'Kingston, Ontario'
           WHEN '44312587' THEN 'Kitchener-Cambridge-Waterloo, Ontario'
           WHEN '1064948755' THEN 'Lethbridge, Alberta'
           WHEN '44312593' THEN 'London, Ontario'
           WHEN '52117746' THEN 'Moncton, New Brunswick'
           WHEN '44312539' THEN 'Montréal, Quebec'
           WHEN '1593151946' THEN 'Nanaimo, British Columbia'
           WHEN '44312563' THEN 'Ottawa-Gatineau, Ontario part'
           WHEN '44312545' THEN 'Ottawa-Gatineau, Quebec part'
           WHEN '52117752' THEN 'Peterborough, Ontario'
           WHEN '44312521' THEN 'Québec, Quebec'
           WHEN '1593151892' THEN 'Red Deer, Alberta'
           WHEN '44312641' THEN 'Regina, Saskatchewan'
           WHEN '44312515' THEN 'Saguenay, Quebec'
           WHEN '44312503' THEN 'Saint John, New Brunswick'
           WHEN '44312647' THEN 'Saskatoon, Saskatchewan'
           WHEN '44312527' THEN 'Sherbrooke, Quebec'
           WHEN '44312581' THEN 'St. Catharines-Niagara, Ontario'
           WHEN '44312473' THEN 'St. John\'s, Newfoundland and Labrador'
           WHEN '44312611' THEN 'Thunder Bay, Ontario'
           WHEN '44312569' THEN 'Toronto, Ontario'
           WHEN '44312533' THEN 'Trois-Rivières, Quebec'
           WHEN '44312677' THEN 'Vancouver, British Columbia'
           WHEN '44312683' THEN 'Victoria, British Columbia'
           WHEN '44312599' THEN 'Windsor, Ontario'
           WHEN '44312629' THEN 'Winnipeg, Manitoba'
           ELSE o.vector END AS cma,
         toFloat(o.csi) AS c18, toFloat(n.csi) AS c25
    WHERE c18 > 0 AND c25 IS NOT NULL
    WITH collect({cma: cma, c18: c18, chg: (c25 / c18 - 1) * 100}) AS rows,
         percentileCont(c18, 0.25) AS p25a, percentileCont(c18, 0.5) AS meda, percentileCont(c18, 0.75) AS p75a,
         percentileCont(c25, 0.25) AS p25b, percentileCont(c25, 0.5) AS medb, percentileCont(c25, 0.75) AS p75b
    UNWIND rows AS r
    RETURN correlate(r.c18, r.chg) AS reversion,
           regress([r.c18], r.chg, r.cma) AS convergenceModel,
           round((p75a - p25a) / meda, 3) AS relativeSpread2018,
           round((p75b - p25b) / medb, 3) AS relativeSpread2025,
           count(*) AS cmas

# H2 — VIOLENCE TOOK OVER. Post-pandemic, severity recomposed toward violence:
# violent severity rose even in cities whose total fell.
