# H5 — PROSPERITY PROTECTS. Cities whose family incomes grew fastest, and whose
# labour markets deteriorated least, should have seen severity fall.
- name: DidProsperityProtect
  description: "Did economic momentum protect Canadian cities from crime? Two lagged-change tests over the same CMAs: family-income GROWTH 2018-2023 (T1FF, both vintages) against severity change 2018-2025, and unemployment DETERIORATION June 2019 to mid-2026 (LFS, pre-pandemic to now) against the same — beside a fit of severity change on both with the 2018 level held. Null verdicts are the finding if they land: across this cross-section the realm has repeatedly found policing variables carrying signal that economic variables do not. 35 CMAs with a 2018 severity baseline; income is nominal (inflation is national, so cross-CMA comparison survives); association, never causation."
  cypher: |
    MATCH (u:CaCmaSet {set:'canada'})-[:LISTS_CSI_THEN]->(o:CaCmaCsiThen)
    MATCH (u)-[:LISTS_CSI_NOW]->(n:CaCmaCsiNow) WHERE n.vector = o.vector
