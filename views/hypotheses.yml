                     CASE WHEN r.clr > medianClearance THEN r.csi END) AS aboveMedian,
           correlate(r.clr, r.csi) AS pooled,
           count(*) AS cmas

# H4 — THE WESTERN RESIDUAL. Western Canada's crime excess is regional lore;
# the test is whether a West indicator survives once clearance is held.
- name: TheWesternResidual
  description: "Is 'crime is a Western problem' geography or policing? A West indicator (BC, Alberta, Saskatchewan, Manitoba = 1) correlated with severity alone, then fitted BESIDE the clearance rate — if the West coefficient collapses, the regional excess is carried by the clearance gap; if it survives, the West is high-severity even at its clearance level and the lore has a residual the policing axis cannot absorb. A binary predictor's standardized beta understates a two-group gap; read direction and survival, not magnitude. ~41 areas, police-reported severity, association never causation, and a statement about PLACES — never about anyone in them."
