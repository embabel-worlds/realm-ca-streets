# H8 — TRIAGE. When overall solving collapses, forces protect violent-case
# clearance: the violent-over-overall premium should WIDEN where the collapse
# is worst. ViolentImpunityCheck asks whether the two fell together; this asks
# whether the GAP between them moved with the collapse.
- name: TheTriageHypothesis
  description: "Do police forces TRIAGE under collapse — protecting violent-case solving while property-crime clearance is let go? Each CMA's violent-clearance premium (violent weighted clearance minus overall weighted clearance) in 2018 and 2025, and the correlation between a CMA's overall-clearance change and the change in that premium: a detectable NEGATIVE r says the worse the overall collapse, the more the violent premium widened — triage. By name: the cities whose overall clearance fell five points or more while violent clearance fell less than half as far. One mechanical caveat the numbers cannot carry: the overall rate already CONTAINS the violent cases, so the premium understates the true violent-vs-nonviolent gap and the triage signal reads conservative. ~41 CMAs, StatCan 35-10-0026, association never causation."
