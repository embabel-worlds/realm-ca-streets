# track RISING violence, if the age-crime curve aggregates up to cities at all.
- name: TheCohortWave
  description: "Does a growing young-adult cohort foretell rising violence? The change in each CMA's 20-24 population share (2021 to 2025, demographic estimates) correlated with its violent-severity change and its total-severity change over the overlapping window (2018-2025 for severity — the vintages the source publishes). The age-crime curve is about individuals; whether it AGGREGATES to city trajectories is exactly what dies or survives here, and the level version already died quietly (youngAdults carries ~nothing in the predictor battery). Four-year share changes are small — a null may mean the cohort moves too slowly to test at this resolution rather than that cohorts never matter. ~35 CMAs; association, never causation, never about any person."
  cypher: |
    MATCH (u:CaCmaSet {set:'canada'})-[:LISTS_YOUTH_POP_MID]->(y1:CaCmaYouthPopMid)
    MATCH (u)-[:LISTS_YOUTH_POP]->(y2:CaCmaYouthPop) WHERE y2.vector = y1.vector
    WITH u, CASE y1.vector
           WHEN '1589917344' THEN 'Abbotsford-Mission, British Columbia'
           WHEN '1589893884' THEN 'Barrie, Ontario'
           WHEN '1589884914' THEN 'Belleville-Quinte West, Ontario'
           WHEN '1589889054' THEN 'Brantford, Ontario'
           WHEN '1589908719' THEN 'Calgary, Alberta'
           WHEN '1589916999' THEN 'Chilliwack, British Columbia'
           WHEN '1589876289' THEN 'Drummondville, Quebec'
           WHEN '1589911134' THEN 'Edmonton, Alberta'
           WHEN '1589866974' THEN 'Fredericton, New Brunswick'
           WHEN '1589895264' THEN 'Greater Sudbury, Ontario'
           WHEN '1589890434' THEN 'Guelph, Ontario'
           WHEN '1589863179' THEN 'Halifax, Nova Scotia'
           WHEN '1589888019' THEN 'Hamilton, Ontario'
           WHEN '1589916654' THEN 'Kamloops, British Columbia'
           WHEN '1589915619' THEN 'Kelowna, British Columbia'
           WHEN '1589884569' THEN 'Kingston, Ontario'
