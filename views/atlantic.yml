           WHEN '44312503' THEN 'Saint John, New Brunswick'
           WHEN '44312647' THEN 'Saskatoon, Saskatchewan'
           WHEN '44312527' THEN 'Sherbrooke, Quebec'
           WHEN '44312581' THEN 'St. Catharines-Niagara, Ontario'
           WHEN '44312473' THEN 'St. John\'s, Newfoundland and Labrador'
