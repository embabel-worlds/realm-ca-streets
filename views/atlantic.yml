           ELSE yp.vector END AS ypCma
    WHERE ypCma = cma
    WITH ca, cma, csi, money, toFloat(yp.value) AS youthPop
    MATCH (ca)-[:LISTS_POP_2025]->(pb:CaCmaPop2025)
    WITH cma, csi, money, youthPop, pb, CASE pb.vector
           WHEN '1589917362' THEN 'Abbotsford-Mission, British Columbia'
           WHEN '1589893902' THEN 'Barrie, Ontario'
