# Housing STARTS by CMA — CMHC via StatCan 34-10-0154, monthly, total units,
# seasonally UNadjusted raw counts. The supply half of "is building keeping
# up with growth"; sum 12 months for an annual pace before comparing.
- name: caHousingStarts
  kind: remote
