    starts: value
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }

# ── The NATIONAL axis (the uk-streets UkDistricts pattern) ───────────────────
# A literal-seeded anchor — MATCH (u:CaCmaSet {set:'canada'}) mints it per
# query; nothing is stored — hangs the WHOLE COUNTRY's series off one WDS
# call: vectorIds takes a comma-separated list, so every CMA arrives in one
# GET. records is one row per VECTOR ($[*].object) and the single point is
# reached by index, so the row keeps its vectorId — the view maps id → name.
- name: nationalCsiNow
  kind: remote
  operation: lfsVectorRange
  cost: { rate: "1/second" }
