    endReferencePeriod: "2035-12-01"
  project:
    month: refPer
    centsPerLitre: value
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }

# Population estimates, July 1, by CMA/CA — annual, fresher than Census 2021.
- name: caPopEstimate
  kind: remote
